<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aslam Shaikh</title>
  <meta name="description" content="Welcome to Aslam Shaikh's personal page." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent-1: #a855f7;
      --accent-2: #6366f1;
      --accent-3: #ec4899;
      --bg-dark: #0a0a0f;
      --bg-card: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
    }

    html, body {
      height: 100%;
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: #fff;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(168, 85, 247, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 80% 70%, rgba(99, 102, 241, 0.2) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 50% 90%, rgba(236, 72, 153, 0.15) 0%, transparent 50%);
      animation: bgPulse 8s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes bgPulse {
      0%   { opacity: 0.8; transform: scale(1);    }
      100% { opacity: 1;   transform: scale(1.05); }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float linear infinite;
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--accent-1); top: -100px; left: -100px; animation-duration: 18s; }
    .orb-2 { width: 300px; height: 300px; background: var(--accent-2); bottom: -80px; right: -80px; animation-duration: 14s; animation-direction: reverse; }
    .orb-3 { width: 200px; height: 200px; background: var(--accent-3); top: 50%; left: 60%; animation-duration: 22s; }

    @keyframes float {
      0%   { transform: translate(0, 0) rotate(0deg);         }
      33%  { transform: translate(30px, -40px) rotate(120deg);}
      66%  { transform: translate(-20px, 20px) rotate(240deg);}
      100% { transform: translate(0, 0) rotate(360deg);       }
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 40L40 0' stroke='rgba(255,255,255,0.03)' stroke-width='1'/%3E%3C/svg%3E");
      z-index: 0;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 2rem;
      text-align: center;
      padding: 2rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 4rem 5rem;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 32px 80px rgba(0,0,0,0.5);
      animation: cardEntry 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      position: relative;
    }

    @keyframes cardEntry {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    .greeting {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 1.25rem;
      animation: fadeUp 0.8s 0.3s both;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6.5rem);
      font-weight: 900;
      line-height: 1.05;
      background: linear-gradient(135deg, #ffffff 0%, #c084fc 40%, #818cf8 70%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 200%;
      animation: gradientShift 5s ease infinite, fadeUp 0.8s 0.5s both;
      letter-spacing: -0.02em;
    }

    @keyframes gradientShift {
      0%   { background-position: 0%   50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0%   50%; }
    }

    .underline-bar {
      height: 4px;
      width: 80px;
      margin: 1.5rem auto 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3));
      animation: barExpand 1s 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes barExpand {
      from { width: 0; opacity: 0; }
      to   { width: 80px; opacity: 1; }
    }

    .tagline {
      margin-top: 1.5rem;
      font-size: 1.05rem;
      font-weight: 300;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.04em;
      animation: fadeUp 0.8s 1s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    .pulse-ring {
      position: absolute;
      inset: -2px;
      border-radius: 30px;
      border: 1.5px solid rgba(168,85,247,0.3);
      animation: ringPulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes ringPulse {
      0%, 100% { opacity: 0.3; transform: scale(1);    }
      50%       { opacity: 0.7; transform: scale(1.01); }
    }

    @media (max-width: 600px) {
      .card { padding: 2.5rem 2rem; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <main>
    <div class="card">
      <div class="pulse-ring"></div>
      <p class="greeting">Welcome</p>
      <h1>Aslam Shaikh</h1>
      <div class="underline-bar"></div>
      <p class="tagline">More coming soon &mdash; stay tuned.</p>
    </div>
  </main>

</body>
</html>
